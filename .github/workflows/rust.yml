name: Build
on: [ pull_request ]

env:
  CARGO_TERM_COLOR: always

jobs:
  # Just build the lib (MSRV is lower than the one for examples etc)
  build_lib:
    name: Build Library (MSRV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0 # MSRV
      - uses: Swatinem/rust-cache@v2
      - run: cargo build
      - name: install some no_std target
        run: rustup target add thumbv7em-none-eabihf
      - name: test no_std build
        run: cargo build --target thumbv7em-none-eabihf # test no_std-build
  build:
    name: Build All Targets
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.95.0 # MSRV of examples, benches, etc
          - stable
          - nightly
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # required because of "audio-visualizer"
      - run: sudo apt update && sudo apt install libasound2-dev libxkbcommon-dev
      - run: cargo build --all-targets
      - run: cargo test
      - name: benchmark quick run
        run: cargo bench -- --quick
      - name: test with simd feature
        run: cargo test --features simd
      # the `simd` feature selects the instruction set at compile time; also
      # cover the AVX2/FMA code path
      - name: test with simd feature for x86-64-v3
        run: cargo test --features simd
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
      - name: install some no_std target
        run: rustup target add thumbv7em-none-eabihf
      - name: test no_std build with simd feature
        run: cargo build --target thumbv7em-none-eabihf --features simd

  style_checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - uses: actions/checkout@v7
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # required because of "audio-visualizer"
      - run: sudo apt update && sudo apt install libasound2-dev libxkbcommon-dev -y
      - name: Rustfmt (checks all source code/all features)
        run: cargo fmt -- --check
      - name: Clippy
        run: |
          cargo clippy --all-targets
          cargo clippy --all-targets --features simd
      - name: Rustdoc
        run: cargo doc --no-deps --document-private-items
