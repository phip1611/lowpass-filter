[package]
name = "lowpass-filter"
description = """
High performance no_std lowpass filter for digital signal processing. A
simple first-order digital filter with a SIMD-accelerated slice API, no
dependencies, no unsafe code, and no allocations.
"""
version = "0.6.0"
authors = ["Philipp Schuster <phip1611@gmail.com>"]
edition = "2024"
keywords = ["audio", "filter", "digital", "lowpass", "dsp"]
categories = ["multimedia", "no-std", "no-std::no-alloc"]
readme = "README.md"
license = "MIT"
homepage = "https://github.com/phip1611/lowpass-filter"
repository = "https://github.com/phip1611/lowpass-filter"
documentation = "https://docs.rs/lowpass-filter/"
rust-version = "1.88"
exclude = [
  ".cargo/",
  ".github/",
  "flake.lock",
  "flake.nix",
  "res/",
  "shell.nix",
  "test/",
]

[lib]
# Lets `cargo bench -- <criterion args>` work, libtest would reject them.
bench = false

[features]
# Explicit SIMD implementation of `run_slice()`; requires Rust 1.89.
simd = ["dep:wide"]

[dependencies]
wide = { version = "1.7", default-features = false, optional = true }

[dev-dependencies]
audio-visualizer = "0.8" # to visualize the output
biquad = "0.6"
criterion = { version = "0.8", features = ["html_reports"] }
hound = "3.5"
itertools = "0.15"
spectrum-analyzer = { version = "2.0", default-features = false, features = [] }

[[bench]]
name = "lowpass"
harness = false


# tests, bins, and examples will run faster
[profile.dev]
opt-level = 1
